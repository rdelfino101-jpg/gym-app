<div class="p-6 sm:p-8 max-w-3xl">
  <h1 class="font-display italic font-black uppercase text-4xl tracking-wide mb-1">Instructores</h1>
  <p class="text-text-muted text-sm mb-6">Gestiona el catálogo de instructores del gym.</p>

  <div class="bg-surface border border-border rounded-xl overflow-hidden mb-8">
    <div class="h-1 w-full gym-top-accent"></div>
    <div class="p-5 flex flex-col sm:flex-row gap-3">
      <input [(ngModel)]="nuevoNombre" name="nuevoNombre" type="text" placeholder="Nombre del instructor"
        (keyup.enter)="agregar()"
        class="flex-1 bg-surface-2 border border-border rounded-lg px-4 py-2.5 text-sm text-text placeholder:text-text-faint focus:outline-none focus:border-accent-orange transition" />
      <button (click)="agregar()" [disabled]="guardando"
        class="bg-accent text-[#0C0C0C] rounded-lg px-6 py-2.5 font-display italic font-black uppercase text-lg tracking-wide hover:brightness-110 transition disabled:opacity-50">
        Agregar
      </button>
    </div>
  </div>

  <div *ngIf="loading" class="text-text-muted text-sm">Cargando...</div>

  <div class="space-y-2.5">
    <div *ngFor="let i of instructores"
      class="bg-surface border border-border rounded-xl p-4 sm:px-5 flex items-center justify-between gap-4 hover:bg-surface-2/50 transition">
      <span class="font-semibold text-base" [class.text-text-faint]="!i.activo" [class.line-through]="!i.activo">
        {{ i.nombre }}
      </span>
      <button (click)="toggleActivo(i)"
        class="text-xs font-extrabold uppercase tracking-wider px-4 py-2 rounded-lg border transition"
        [class.border-accent]="!i.activo" [class.text-accent]="!i.activo" [class.hover:bg-accent]="!i.activo" [class.hover:text-[#0C0C0C]]="!i.activo"
        [class.border-border]="i.activo" [class.text-text-muted]="i.activo" [class.hover:border-accent-orange]="i.activo" [class.hover:text-accent-orange]="i.activo">
        {{ i.activo ? 'Desactivar' : 'Activar' }}
      </button>
    </div>
  </div>
</div>
