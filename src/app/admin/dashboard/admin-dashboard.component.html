<div class="p-8">
  <h1 class="font-display font-bold text-2xl mb-1">Solicitudes de membresía pendientes</h1>
  <p class="text-text-muted text-sm mb-6">Revisa y aprueba o rechaza a cada cliente nuevo.</p>

  <div *ngIf="loading" class="text-text-muted text-sm">Cargando...</div>

  <div *ngIf="!loading && solicitudes.length === 0" class="text-text-muted text-sm">
    No hay solicitudes pendientes por ahora.
  </div>

  <div class="space-y-3">
    <div *ngFor="let sol of solicitudes" class="bg-surface border border-border rounded p-5 flex items-center justify-between gap-4">
      <div>
        <div class="font-semibold">{{ sol.profiles.nombre }} {{ sol.profiles.apellido }}</div>
        <div class="text-sm text-text-muted">{{ sol.profiles.telefono }} · {{ sol.planes_membresia.nombre }}</div>
      </div>

      <div class="flex items-center gap-3">
        <div class="flex items-center gap-1">
          <span class="text-text-faint text-sm">$</span>
          <input [(ngModel)]="sol.monto_aprobar" type="number" step="0.01"
            class="w-24 bg-surface-2 border border-border rounded px-2 py-1.5 text-sm text-text focus:outline-none focus:border-accent" />
        </div>
        <button (click)="aprobar(sol)" [disabled]="procesando === sol.id"
          class="bg-accent text-[#181410] rounded-lg px-4 py-2 text-sm font-bold hover:brightness-110 disabled:opacity-50">
          {{ procesando === sol.id ? '...' : 'Aprobar' }}
        </button>
        <button (click)="rechazar(sol)" [disabled]="procesando === sol.id"
          class="bg-transparent border border-danger text-danger rounded-lg px-4 py-2 text-sm font-semibold hover:bg-danger/10 disabled:opacity-50">
          Rechazar
        </button>
      </div>
    </div>
  </div>
</div>
