<div class="p-6 sm:p-8 max-w-5xl">
  <h1 class="font-display italic font-black uppercase text-4xl tracking-wide mb-1">
    Solicitudes de membresía pendientes
  </h1>
  <p class="text-text-muted text-sm mb-6">Revisa y aprueba o rechaza a cada cliente nuevo.</p>

  <div *ngIf="loading" class="text-text-muted text-sm">Cargando...</div>

  <div *ngIf="!loading && solicitudes.length === 0"
    class="bg-surface border border-border rounded-xl p-6 text-text-muted text-sm">
    No hay solicitudes pendientes por ahora.
  </div>

  <div class="space-y-3">
    <div *ngFor="let sol of solicitudes"
      class="bg-surface border border-border border-l-4 border-l-accent rounded-xl p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4 hover:border-border/80 transition">
      <div>
        <div class="font-bold text-base text-text">{{ sol.profiles.nombre }} {{ sol.profiles.apellido }}</div>
        <div class="text-sm text-text-muted mt-0.5">
          {{ sol.profiles.telefono }} · <span class="text-accent font-semibold">{{ sol.planes_membresia.nombre }}</span>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-3">
        <div class="flex items-center bg-surface-2 border border-border rounded-lg px-3 py-1.5 focus-within:border-accent transition">
          <span class="text-accent font-bold text-sm mr-1">$</span>
          <input [(ngModel)]="sol.monto_aprobar" type="number" step="0.01"
            class="w-24 bg-transparent text-sm font-semibold text-text tabular-nums focus:outline-none" />
        </div>
        <button (click)="aprobar(sol)" [disabled]="procesando === sol.id"
          class="bg-accent text-[#0C0C0C] rounded-lg px-5 py-2.5 text-xs font-extrabold uppercase tracking-wider hover:brightness-110 transition disabled:opacity-50">
          {{ procesando === sol.id ? '...' : 'Aprobar' }}
        </button>
        <button (click)="rechazar(sol)" [disabled]="procesando === sol.id"
          class="bg-transparent border border-danger text-danger rounded-lg px-4 py-2.5 text-xs font-extrabold uppercase tracking-wider hover:bg-danger hover:text-white transition disabled:opacity-50">
          Rechazar
        </button>
      </div>
    </div>
  </div>
</div>
