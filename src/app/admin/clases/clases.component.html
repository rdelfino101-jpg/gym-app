<div class="p-6 sm:p-8 max-w-3xl">
  <h1 class="font-display italic font-black uppercase text-4xl tracking-wide mb-1">Clases</h1>
  <p class="text-text-muted text-sm mb-6">Gestiona el catálogo de tipos de clase.</p>

  <div class="bg-surface border border-border rounded-xl overflow-hidden mb-8">
    <div class="h-1 w-full gym-top-accent"></div>
    <div class="p-5 space-y-3">
      <input [(ngModel)]="nuevoNombre" name="nuevoNombre" type="text" placeholder="Nombre (ej. CrossFit)"
        class="w-full bg-surface-2 border border-border rounded-lg px-4 py-2.5 text-sm text-text placeholder:text-text-faint focus:outline-none focus:border-accent-orange transition" />
      <input [(ngModel)]="nuevaDescripcion" name="nuevaDescripcion" type="text" placeholder="Descripción (opcional)"
        class="w-full bg-surface-2 border border-border rounded-lg px-4 py-2.5 text-sm text-text placeholder:text-text-faint focus:outline-none focus:border-accent-orange transition" />
      <button (click)="agregar()" [disabled]="guardando"
        class="w-full bg-accent text-[#0C0C0C] rounded-lg py-3 font-display italic font-black uppercase text-lg tracking-wide hover:brightness-110 transition disabled:opacity-50">
        Agregar clase
      </button>
    </div>
  </div>

  <div *ngIf="loading" class="text-text-muted text-sm">Cargando...</div>

  <div class="space-y-2.5">
    <div *ngFor="let c of clases"
      class="bg-surface border border-border rounded-xl p-4 sm:px-5 flex items-center justify-between gap-4 hover:bg-surface-2/50 transition">
      <div [class.text-text-faint]="!c.activo">
        <div class="font-bold text-base" [class.line-through]="!c.activo">{{ c.nombre }}</div>
        <div class="text-sm text-text-muted mt-0.5" *ngIf="c.descripcion">{{ c.descripcion }}</div>
      </div>
      <button (click)="toggleActivo(c)"
        class="text-xs font-extrabold uppercase tracking-wider px-4 py-2 rounded-lg border transition"
        [class.border-accent]="!c.activo" [class.text-accent]="!c.activo" [class.hover:bg-accent]="!c.activo" [class.hover:text-[#0C0C0C]]="!c.activo"
        [class.border-border]="c.activo" [class.text-text-muted]="c.activo" [class.hover:border-accent-orange]="c.activo" [class.hover:text-accent-orange]="c.activo">
        {{ c.activo ? 'Desactivar' : 'Activar' }}
      </button>
    </div>
  </div>
</div>
