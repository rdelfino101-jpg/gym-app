<div class="min-h-screen bg-gym-stripes text-text flex items-center justify-center p-6 relative overflow-hidden">
  <div class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-12 gap-10 items-center z-20">

    <!-- Panel izquierdo de marca -->
    <div class="lg:col-span-6 space-y-6">
      <div class="inline-flex items-center gap-3">
        <div class="w-11 h-11 rounded-lg bg-accent flex items-center justify-center font-display italic font-black text-3xl text-[#0C0C0C]">
          G
        </div>
        <span class="font-display italic font-black text-3xl tracking-wide uppercase">GYM ADMIN</span>
      </div>

      <div class="space-y-3">
        <div class="inline-block bg-accent text-[#0C0C0C] font-display italic font-black uppercase text-5xl sm:text-6xl leading-none px-4 py-2 -skew-x-6">
          ENTRENA SIN LÍMITES
        </div>
        <p class="text-text-muted text-base max-w-md pt-2">
          Accede a tu cuenta para reservar clases, revisar tus horarios disponibles y administrar tu membresía.
        </p>
      </div>
    </div>

    <!-- Tarjeta de login -->
    <div class="lg:col-span-6 w-full max-w-md lg:ml-auto">
      <div class="bg-surface border border-border rounded-xl overflow-hidden shadow-2xl">
        <div class="h-1.5 w-full gym-top-accent"></div>

        <div class="p-8">
          <h1 class="font-display italic font-black uppercase text-4xl tracking-wide mb-1">Bienvenido</h1>
          <p class="text-text-muted text-sm mb-7">Ingresa tus datos para continuar.</p>

          <div *ngIf="error" class="bg-danger/10 border border-danger/40 text-red-300 text-sm px-3.5 py-2.5 rounded-lg mb-5">
            {{ error }}
          </div>

          <form (ngSubmit)="onSubmit()">
            <div class="mb-4">
              <label class="block text-xs font-bold uppercase tracking-wider text-text-muted mb-2">
                Correo electrónico
              </label>
              <input [(ngModel)]="email" name="email" type="email" required placeholder="tu@correo.com"
                class="w-full bg-surface-2 border border-border rounded-lg px-4 py-3 text-sm text-text placeholder:text-text-faint focus:outline-none focus:border-accent-orange focus:ring-2 focus:ring-accent-orange/20 transition" />
            </div>

            <div class="mb-6">
              <label class="block text-xs font-bold uppercase tracking-wider text-text-muted mb-2">
                Contraseña
              </label>
              <input [(ngModel)]="password" name="password" type="password" required placeholder="••••••••"
                class="w-full bg-surface-2 border border-border rounded-lg px-4 py-3 text-sm text-text placeholder:text-text-faint focus:outline-none focus:border-accent-orange focus:ring-2 focus:ring-accent-orange/20 transition" />
            </div>

            <button type="submit" [disabled]="loading"
              class="w-full bg-accent text-[#0C0C0C] rounded-lg py-3.5 font-display italic font-black uppercase text-xl tracking-wide hover:brightness-110 active:scale-[0.99] transition disabled:opacity-50">
              {{ loading ? 'Ingresando...' : 'Ingresar' }}
            </button>
          </form>

          <p class="text-text-muted text-sm mt-6 text-center">
            ¿No tienes cuenta?
            <a routerLink="/registro" class="text-accent-orange font-bold hover:text-accent transition">Regístrate</a>
          </p>
        </div>
      </div>
    </div>

  </div>
</div>
