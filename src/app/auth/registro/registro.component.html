<div class="min-h-screen bg-gym-stripes text-text flex items-center justify-center p-6 relative overflow-hidden">
  <div class="w-full max-w-xl z-20" *ngIf="!success">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 rounded-lg bg-accent flex items-center justify-center font-display italic font-black text-2xl text-[#0C0C0C]">
        G
      </div>
      <div>
        <div class="font-display italic font-black text-2xl uppercase tracking-wide">GYM ADMIN</div>
        <div class="text-xs uppercase tracking-widest text-text-muted">Registro de cliente</div>
      </div>
    </div>

    <div class="bg-surface border border-border rounded-xl overflow-hidden shadow-2xl">
      <div class="h-1.5 w-full gym-top-accent"></div>

      <div class="p-8">
        <h1 class="font-display italic font-black uppercase text-4xl tracking-wide mb-1">Crear cuenta</h1>
        <p class="text-text-muted text-sm mb-7">Regístrate para reservar tus clases.</p>

        <div *ngIf="error" class="bg-danger/10 border border-danger/40 text-red-300 text-sm px-3.5 py-2.5 rounded-lg mb-5">
          {{ error }}
        </div>

        <form (ngSubmit)="onSubmit()">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-text-muted mb-2">Nombre</label>
              <input [(ngModel)]="nombre" name="nombre" type="text" required
                class="w-full bg-surface-2 border border-border rounded-lg px-3.5 py-3 text-sm text-text focus:outline-none focus:border-accent-orange focus:ring-2 focus:ring-accent-orange/20 transition" />
            </div>
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-text-muted mb-2">Apellido</label>
              <input [(ngModel)]="apellido" name="apellido" type="text" required
                class="w-full bg-surface-2 border border-border rounded-lg px-3.5 py-3 text-sm text-text focus:outline-none focus:border-accent-orange focus:ring-2 focus:ring-accent-orange/20 transition" />
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-text-muted mb-2">Correo electrónico</label>
              <input [(ngModel)]="correo" name="correo" type="email" required
                class="w-full bg-surface-2 border border-border rounded-lg px-3.5 py-3 text-sm text-text focus:outline-none focus:border-accent-orange focus:ring-2 focus:ring-accent-orange/20 transition" />
            </div>
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-text-muted mb-2">Teléfono</label>
              <input [(ngModel)]="telefono" name="telefono" type="text" required
                class="w-full bg-surface-2 border border-border rounded-lg px-3.5 py-3 text-sm text-text focus:outline-none focus:border-accent-orange focus:ring-2 focus:ring-accent-orange/20 transition" />
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-text-muted mb-2">Contraseña</label>
              <input [(ngModel)]="password" name="password" type="password" required
                class="w-full bg-surface-2 border border-border rounded-lg px-3.5 py-3 text-sm text-text focus:outline-none focus:border-accent-orange focus:ring-2 focus:ring-accent-orange/20 transition" />
            </div>
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-text-muted mb-2">Confirmar contraseña</label>
              <input [(ngModel)]="password2" name="password2" type="password" required
                class="w-full bg-surface-2 border border-border rounded-lg px-3.5 py-3 text-sm text-text focus:outline-none focus:border-accent-orange focus:ring-2 focus:ring-accent-orange/20 transition" />
            </div>
          </div>

          <div class="mb-5">
            <label class="block text-xs font-bold uppercase tracking-wider text-text-muted mb-2">Elige tu plan</label>
            <select [(ngModel)]="planId" name="planId" required
              class="w-full bg-surface-2 border border-border rounded-lg px-3.5 py-3 text-sm text-text focus:outline-none focus:border-accent transition">
              <option value="" disabled selected>Selecciona un plan</option>
              <option *ngFor="let plan of planes" [value]="plan.id">
                {{ plan.nombre }} — ${{ plan.precio }}
              </option>
            </select>
          </div>

          <label class="flex items-center gap-2.5 text-sm text-text-muted mb-6 cursor-pointer">
            <input [(ngModel)]="terms" name="terms" type="checkbox" class="accent-accent w-4 h-4 rounded" required>
            Acepto los términos y condiciones
          </label>

          <button type="submit" [disabled]="loading"
            class="w-full bg-accent text-[#0C0C0C] rounded-lg py-3.5 font-display italic font-black uppercase text-xl tracking-wide hover:brightness-110 active:scale-[0.99] transition disabled:opacity-50">
            {{ loading ? 'Creando cuenta...' : 'Crear cuenta' }}
          </button>
        </form>
      </div>
    </div>
  </div>

  <div class="w-full max-w-md z-20 text-center" *ngIf="success">
    <div class="bg-surface border border-accent/60 rounded-xl overflow-hidden shadow-2xl">
      <div class="h-1.5 w-full gym-top-accent"></div>
      <div class="p-8">
        <h1 class="font-display italic font-black uppercase text-4xl text-accent mb-3">¡Gracias, {{ nombre }}!</h1>
        <p class="text-text-muted text-sm leading-relaxed">
          Revisa tu correo para confirmar tu cuenta. Una vez confirmado, tu membresía quedará pendiente de aprobación por el gym.
        </p>
      </div>
    </div>
  </div>
</div>
